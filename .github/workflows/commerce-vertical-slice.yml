name: Commerce Vertical Slice

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'services/commerce-api/**'
      - 'docs/engineering/VERTICAL-SLICE-001.md'
      - '.github/workflows/commerce-vertical-slice.yml'

jobs:
  commerce-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/commerce-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/commerce-api/package.json

      - name: Install dependencies
        run: npm install --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries
        run: npm run lint:boundaries

      - name: HTTP contract tests
        run: npm run test:contract

      - name: Full test suite
        run: npm test
