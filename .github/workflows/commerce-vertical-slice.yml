name: Commerce Vertical Slice

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'services/commerce-api/**'
      - 'docs/engineering/VERTICAL-SLICE-001.md'
      - '.github/workflows/commerce-vertical-slice.yml'

jobs:
  commerce-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/commerce-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
