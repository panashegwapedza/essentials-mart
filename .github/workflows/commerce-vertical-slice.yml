name: Commerce Vertical Slice

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'services/commerce-api/**'
      - 'docs/engineering/VERTICAL-SLICE-001.md'
      - '.github/workflows/commerce-vertical-slice.yml'

jobs:
  commerce-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/commerce-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Dependency auditing was previously disabled via --no-audit. It is
      # back on: install stays clean, and a separate step below fails the
      # build on any high/critical advisory so a vulnerable transitive
      # dependency can't silently ride into main.
      - name: Install dependencies
        run: npm install --no-fund

      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Architecture boundary check
        run: npm run lint:boundaries

      - name: Build
        run: npm run build

      - name: Contract tests (HTTP API surface)
        run: npm run test:contract

      - name: Full test suite
        run: npm test
